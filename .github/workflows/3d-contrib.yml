name: 3D Contribution Graph

on:
  repository_dispatch:
    types: [contribution-updated]
  schedule:
    - cron: "*/30 * * * *" # 每 30 分钟兜底刷新（UTC）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-contribution-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.8.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ADA-quart
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "chore: update 3d contribution graph" || exit 0
          git pull --rebase origin main
          git push