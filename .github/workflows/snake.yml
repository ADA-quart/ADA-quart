name: Generate contribution snake

on:
  repository_dispatch:
    types: [contribution-updated]
  schedule:
    - cron: "27,57 * * * *" # 每 30 分钟兜底刷新（UTC），与 3D/Metrics 错峰
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-contribution-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ADA-quart
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3e7ed1
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
