name: WakaTime Stats

on:
  schedule:
    - cron: "0 18 * * *" # 每天 02:00 (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      # 未配置 WAKATIME_API_KEY 时安静跳过，不再每天报错。
      # 在仓库 Settings → Secrets → Actions 里添加 WAKATIME_API_KEY 后本工作流自动生效。
      - name: Check WakaTime key
        id: key
        run: |
          if [ -n "${{ secrets.WAKATIME_API_KEY }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::WAKATIME_API_KEY not set — skipping WakaTime stats update."
          fi
      - uses: anmol098/waka-readme-stats@master
        if: steps.key.outputs.present == 'true'
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECTION_NAME: "waka"
          SHOW_LOC_CHART: "True"
          SHOW_PROFILE_VIEWS: "True"
          SHOW_OS: "True"
          SHOW_EDITORS: "True"
          SHOW_LANGUAGE: "True"
          SHOW_LANGUAGE_PER_REPO: "True"
          SHOW_PROJECTS: "True"
          SHOW_TIMEZONE: "True"
          SHOW_COMMIT: "True"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_SHORT_INFO: "True"
          SHOW_AI_CODE_TIME: "False"
          SHOW_AI_CODING: "False"
          LOCALE: "en"
          COMMIT_BY_ME: "True"
          COMMIT_MESSAGE: "chore: update wakatime stats"
          UPDATED_DATE_FORMAT: "%Y-%m-%d %H:%M:%S"